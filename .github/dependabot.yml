version: 2
updates:
  - package-ecosystem: gomod
    # Every module: the core, the SQLite store and its users (nested since
    # 1.47.0), the NATS and Matrix adapters.
    directories:
      - "/"
      - "/persist/sqlite"
      - "/gomobile"
      - "/cmd/yserve"
      - "/cmd/ygo-server"
      - "/examples/collab-server"
      - "/examples/offline-first"
      - "/server/backplane/nats"
      - "/integration/matrix"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - go

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions

  - package-ecosystem: npm
    directory: "/testdata/gen"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: "testdata"
      include: scope
    labels:
      - dependencies
      - javascript
