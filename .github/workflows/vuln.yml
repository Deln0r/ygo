name: vuln

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: run govulncheck
        run: govulncheck ./...
      # The nested modules are modules of their own, so the run above does
      # not see their dependencies (nats.go and nats-server, mautrix, and
      # the golang.org/x modules they bring).
      - name: run govulncheck on the NATS backplane module
        working-directory: server/backplane/nats
        run: govulncheck ./...
      - name: run govulncheck on the Matrix transport module
        working-directory: integration/matrix
        run: govulncheck ./...
