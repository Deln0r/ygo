name: test

on:
  push:
    branches: [main]
    # The nested modules' tags too: the published-dependencies job checks
    # each module against the versions it requires once they are out.
    tags: ["v*", "persist/sqlite/v*", "gomobile/v*", "cmd/yserve/v*", "cmd/ygo-server/v*"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # go.mod's floor and the current release: our declared minimum, and
        # what a new adopter actually runs.
        #
        # The second leg is `stable` rather than a number on purpose. It used
        # to be pinned, and the comment above it said the pair was "exactly
        # the two Go releases upstream still supports". Go 1.27 shipped, the
        # pin stayed at 1.26, and for weeks nothing tested the current release
        # while the comment kept saying otherwise. `stable` cannot go stale;
        # the cost is that a new Go release can turn this red without a
        # commit, which for a library is the early warning we want.
        #
        # The floor stays pinned because it is a promise: the core's go.mod
        # says 1.23 (since 1.47.0, when SQLite and its users moved to nested
        # modules that say 1.26). The jobs run the core module alone (no
        # go.work in a checkout), and the floor leg keeps the toolchain it
        # was given (GOTOOLCHAIN=local), so nothing newer can pass for it.
        go: ["1.23", "stable"]
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: go mod download
        run: go mod download
      - name: go.mod and go.sum are tidy at the floor
        if: matrix.go != 'stable'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: go vet
        run: go vet ./...
      - name: go test
        if: matrix.go != 'stable'
        run: go test -race ./...
      - name: go test with coverage
        if: matrix.go == 'stable'
        # Coverage counts every library package from every test binary
        # (-coverpkg), not only each package's own tests: much of
        # internal/... is exercised through the public API tests in the
        # root package. Commands, examples and benchmarks are left out, and
        # since 1.47.0 so are the nested modules (persist/sqlite, gomobile,
        # the server commands): their tests run in the nested-modules job.
        run: |
          pkgs=$(go list ./... | grep -v -E '/(cmd|examples|benchmarks)(/|$)' | paste -sd, -)
          go test -race -coverpkg="$pkgs" -coverprofile=coverage.txt -covermode=atomic ./...
          go tool cover -func=coverage.txt | tail -1
      - name: upload coverage
        if: matrix.go == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.txt
      - name: send coverage to Coveralls
        if: matrix.go == 'stable' && github.event_name == 'push'
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.txt
          format: golang
          # The action downloads its reporter from GitHub releases on every
          # run. On 8 Nov 2026 those downloads failed for hours and turned a
          # docs-only commit red with every test passing: a missing upload
          # must not fail the build.
          fail-on-error: false

  nested-modules:
    name: nested modules (persist/sqlite, gomobile, commands, examples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: in the workspace, against this checkout of the core
        run: |
          ./tools/go-work.sh
          ./tools/check-modules.sh
          for d in persist/sqlite gomobile cmd/yserve cmd/ygo-server examples/collab-server examples/offline-first; do
            echo "== $d"
            (cd "$d" && go vet ./... && go test -race ./...)
          done

  published-dependencies:
    name: nested modules against the published versions they require
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: tidy, build and vet outside the workspace
        # What an adopter resolves: each module with the core (and
        # persist/sqlite) at the versions its go.mod requires, from the
        # proxy, its go.sum complete. A core tag has nothing nested to
        # check (the nested go.sum gain the core's checksum in a later
        # commit); a nested module's tag checks that module. On a branch
        # every module, and a module that requires the release being
        # prepared (doc.go's Version) before it is published is skipped
        # with a notice (the proxy answers "unknown revision" for that very
        # version; any other lookup failure fails), and so is a go.sum that
        # lacks only the checksums of the release being prepared (they are
        # committed after the tags they need, design 7 of the plan).
        run: |
          release=$(sed -n 's/^const Version = "\(.*\)"$/v\1/p' doc.go)
          case "${GITHUB_REF_TYPE}:${GITHUB_REF_NAME}" in
            tag:v*) echo "a core tag: nothing nested to check"; exit 0 ;;
            tag:*) mods="${GITHUB_REF_NAME%/v*}" ;;
            *) mods="persist/sqlite gomobile cmd/yserve cmd/ygo-server examples/collab-server examples/offline-first" ;;
          esac
          for d in $mods; do
            skip=""
            for dep in $(awk '$1 ~ /^github.com\/Deln0r\/ygo/ && $2 ~ /^v/ { print $1 "@" $2 }' "$d/go.mod"); do
              if ! out=$(go list -m "$dep" 2>&1); then
                # The proxy names a nested module's revision by its tag:
                # persist/sqlite/v1.47.0 for github.com/Deln0r/ygo/persist/sqlite.
                mod="${dep%@*}"
                rev="$release"
                [ "$mod" = github.com/Deln0r/ygo ] || rev="${mod#github.com/Deln0r/ygo/}/$release"
                if [ "${GITHUB_REF_TYPE}" != tag ] && [ "${dep##*@}" = "$release" ] && echo "$out" | grep -qF "invalid version: unknown revision $rev"; then
                  skip="$dep"
                  break
                fi
                echo "$d: $out"
                exit 1
              fi
            done
            if [ -n "$skip" ]; then
              echo "::notice::$d: $skip is the release being prepared and not published yet; skipped"
              continue
            fi
            echo "== $d"
            (
              cd "$d"
              go mod tidy
              git diff --exit-code -- go.mod
              if ! git diff --quiet -- go.sum; then
                added=$(git diff -U0 -- go.sum | grep '^+[^+]' || true)
                other=$(echo "$added" | grep -v "^+github.com/Deln0r/ygo[^ ]* $release[ /]" || true)
                if [ "${GITHUB_REF_TYPE}" = tag ] || [ -n "$other" ] || git diff -U0 -- go.sum | grep -q '^-[^-]'; then
                  git diff -- go.sum
                  exit 1
                fi
                echo "::notice::$d: go.sum lacks only the checksums of $release, committed after its tags"
              fi
              go build ./... && go vet ./...
            )
          done

  backplane-nats:
    name: backplane-nats (nested module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The NATS adapter is a separate opt-in module built outside the
          # core matrix; it resolves the core via a local replace directive.
          # `stable` for the same reason as the test matrix: a pinned current
          # release is a pin that goes stale.
          go-version: stable
      - name: test the NATS backplane adapter
        working-directory: server/backplane/nats
        run: |
          go mod download
          go vet ./...
          go test -race ./...
      - name: build against the pinned core (drop replace) to catch interface drift
        working-directory: server/backplane/nats
        run: |
          # The tests above build through the local replace (HEAD). This step
          # builds the adapter against the exact core version external users
          # resolve (the `require`), so a Backplane-interface change at HEAD
          # that outpaces the pin fails CI instead of an adopter's build.
          go mod edit -dropreplace github.com/Deln0r/ygo
          go mod tidy
          go build ./...

  cross-compile:
    name: cross-compile (the targets the README claims, go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.23", "stable"]
    env:
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      # Build-only, no tests: this job exists so the portability claim on the
      # README cannot rot silently. Nothing else in CI cross-compiles, which is
      # how the wasm caveat below went unnoticed until someone tried it by hand.
      - name: whole module
        run: |
          for t in android/arm64 linux/arm64 windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./...
          done
      - name: library packages only
        run: |
          # On these targets the cmd/ binaries need external (cgo) linking, so
          # only the importable packages are built - which is all an adopter
          # consumes there anyway.
          for t in ios/arm64 android/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build . ./persist/... ./client ./server/... ./internal/...
          done
      - name: the nested modules (in the workspace)
        if: matrix.go == 'stable'
        env:
          GOWORK: ""
        run: |
          ./tools/go-work.sh
          for t in android/arm64 linux/arm64 windows/amd64 darwin/arm64 freebsd/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./persist/sqlite/... ./gomobile/... ./cmd/yserve/... ./cmd/ygo-server/... ./examples/collab-server/... ./examples/offline-first/...
          done
          for t in ios/arm64 android/amd64; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build ./persist/sqlite ./gomobile
          done
      - name: wasm
        run: |
          # The SQLite store is a nested module (modernc.org/sqlite is
          # transpiled C and modernc.org/libc has no wasm build); a browser
          # adopter supplies its own persist.Store, so the core must keep
          # compiling for wasm.
          for t in js/wasm wasip1/wasm; do
            echo "== $t"
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build . ./persist ./client ./server ./internal/...
          done

  y-websocket:
    name: y-websocket clients against yserve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The fixtures compare bytes. This runs stock y-websocket clients
      # (2.1 and 3.1) against the yserve binary: sync, presence, a large
      # paste, rooms with a slash, a restart with a store, -path-prefix.
      # Two bugs lived behind passing fixtures until it existed.
      - name: build yserve
        run: |
          ./tools/go-work.sh
          go build -o "$RUNNER_TEMP/yserve" ./cmd/yserve
      - name: install the clients
        working-directory: testdata/e2e
        run: npm ci
      - name: run the clients
        working-directory: testdata/e2e
        run: node y-websocket.mjs "$RUNNER_TEMP/yserve"

  hocuspocus-server:
    name: Hocuspocus providers against ygo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: build the server and hook fixture
        run: |
          ./tools/go-work.sh
          go build -o "$RUNNER_TEMP/yserve" ./cmd/yserve
          go build -o "$RUNNER_TEMP/hpserver" ./testdata/e2e/hpserver
      - name: install the providers
        working-directory: testdata/e2e
        run: npm ci
      - name: run the providers
        working-directory: testdata/e2e
        run: node hocuspocus-server.mjs "$RUNNER_TEMP/hpserver" "$RUNNER_TEMP/yserve"
      # yjs documents synced over HTTP (HTTPSyncHandler) with fetch, next to a
      # y-websocket client: the bytes against yjs's own encoder, live
      # delivery both ways, 304 on an unchanged document.
      - name: sync over HTTP with yjs
        working-directory: testdata/e2e
        run: node http-sync.mjs "$RUNNER_TEMP/hpserver"

  hocuspocus:
    name: Go client against Hocuspocus servers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The ygo client in Hocuspocus mode against stock @hocuspocus/server
      # 4.8, 3.4 and 2.15, next to the stock provider of each version:
      # sync both ways, presence, stateless, a refused and a read-only
      # token, server 2 without an auth hook, and server 4's idle timeout
      # with and without the keepalive. Server 4 needs node 22.
      - name: build the Go side
        run: go build -o "$RUNNER_TEMP/hpclient" ./testdata/e2e/hpclient
      - name: install the servers and providers
        working-directory: testdata/e2e
        run: npm ci
      - name: run the checks
        working-directory: testdata/e2e
        run: node hocuspocus.mjs "$RUNNER_TEMP/hpclient"

  gomobile-android:
    name: gomobile bind (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The pure-Go gomobile package compiles in the test job, but only
      # gobind's generated Java shows whether the binding compiles: from
      # v1.8.0 to v1.31.0 it did not (two toString methods) and nothing
      # noticed. The runner image ships the Android SDK, the NDK and Java.
      - name: bind the Android AAR
        env:
          MOBILE: v0.0.0-20261011034528-197770444867
        run: |
          go install golang.org/x/mobile/cmd/gomobile@$MOBILE
          go install golang.org/x/mobile/cmd/gobind@$MOBILE
          gomobile init
          # gomobile is a module of its own; bind it against this checkout
          # through replace directives (CI-only edits, not committed).
          cd gomobile
          export GOWORK=off
          go mod edit -replace github.com/Deln0r/ygo=.. -replace github.com/Deln0r/ygo/persist/sqlite=../persist/sqlite
          go get golang.org/x/mobile/bind@$MOBILE
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          gomobile bind -target=android -androidapi 21 -o "$RUNNER_TEMP/ygo.aar" .
          unzip -l "$RUNNER_TEMP/ygo.aar" | grep -q 'jni/arm64-v8a/libgojni.so'

  matrix-transport:
    name: matrix transport (real Dendrite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: start Dendrite
        # A real homeserver, not the unit double: the double is written by the
        # same hand as the client, so only the real server can refute an
        # assumption both of them share. Without this job "works with Matrix"
        # would be a promise rather than a fact.
        working-directory: integration/matrix
        run: ./testdata/up.sh
      - name: test the Matrix transport
        working-directory: integration/matrix
        run: |
          go mod download
          go vet ./...
          go test -race ./...
      - name: the core must not have gained the Matrix dependency tree
        run: |
          # The whole point of a nested module is that importing ygo does not
          # drag mautrix in. This is the assertion, not the intention.
          if go list -m all | grep -qiE 'mautrix|zerolog|tidwall'; then
            echo "core module now depends on the Matrix transport's tree"; exit 1
          fi
      - name: build against the pinned core (drop replace) to catch interface drift
        working-directory: integration/matrix
        run: |
          # The tests above build through the local replace (HEAD). This step
          # builds against the exact core version an external user resolves
          # (the `require`), so a core change at HEAD that outpaces the pin
          # fails CI instead of an adopter's build. The module calls
          # ygo.ValidateUpdate, so the pin must name a release that has it.
          go mod edit -dropreplace github.com/Deln0r/ygo
          go mod tidy
          go build ./...
          git checkout -- go.mod go.sum
      - name: converge two peers through a room
        working-directory: integration/matrix
        # Exits non-zero unless both peers agree AND both edits survived.
        run: go run ./cmd/matrixdemo
      - name: dendrite logs on failure
        if: failure()
        working-directory: integration/matrix
        run: docker compose -f testdata/docker-compose.yml logs --tail=100
      - name: stop Dendrite
        if: always()
        working-directory: integration/matrix
        run: ./testdata/down.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Deliberately NOT `stable`. golangci-lint-action installs a prebuilt
          # binary, and a linter built with an older Go can fail to load the
          # standard library of a newer one - a red build that says nothing
          # about our code. This job's Go tracks the pinned linter below, not
          # upstream support; move the two together.
          go-version: "1.26"
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pinned (not "latest") so local installs of the same version
          # produce identical results. Bump deliberately. See
          # docs/tech-debt.md for the lint-not-enforced history.
          version: v2.12.2
      - name: lint the nested modules (in the workspace)
        run: |
          ./tools/go-work.sh
          for d in persist/sqlite gomobile cmd/yserve cmd/ygo-server examples/collab-server examples/offline-first; do
            echo "== $d"
            (cd "$d" && golangci-lint run)
          done

  fixtures:
    name: fixtures (cross-language)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          # The fixtures pin Node 26's V8 (14.6): yjs's merge of updates
          # tied at a GC and an item is ordered by V8's sort, and V8 14
          # sorts arrays shorter than 8 by binary insertion alone where
          # V8 12 (Node 22) ran them through TimSort's run detection
          # (testdata/v8-sort-fixtures.json).
          node-version: "26"
      - name: install yjs and lib0
        working-directory: testdata/gen
        run: npm install
      - name: regenerate lib0 fixtures
        working-directory: testdata/gen
        run: node gen-lib0.mjs
      - name: regenerate yjs-update fixtures
        working-directory: testdata/gen
        run: node gen-yjs-update.mjs
      - name: regenerate yjs-update V2 fixtures
        working-directory: testdata/gen
        run: node gen-yjs-update-v2.mjs
      - name: regenerate awareness fixtures
        working-directory: testdata/gen
        run: node gen-awareness.mjs
      - name: regenerate sync envelope fixtures
        working-directory: testdata/gen
        run: node gen-sync.mjs
      - name: regenerate xml fixtures
        working-directory: testdata/gen
        run: node gen-xml.mjs
      - name: regenerate RLE fixtures
        working-directory: testdata/gen
        run: node gen-rle.mjs
      - name: regenerate undo fixtures
        working-directory: testdata/gen
        run: node gen-undo.mjs
      - name: regenerate snapshot fixtures
        working-directory: testdata/gen
        run: node gen-snapshot.mjs
      - name: regenerate subdoc fixtures
        working-directory: testdata/gen
        run: node gen-subdoc.mjs
      - name: regenerate wire-edge fixtures
        working-directory: testdata/gen
        run: node gen-wire-edge.mjs
      - name: regenerate rich-text behaviour fixtures
        working-directory: testdata/gen
        run: node gen-rich-text.mjs
      - name: regenerate observer fixtures
        working-directory: testdata/gen
        run: node gen-observers.mjs
      - name: regenerate update-event fixtures
        working-directory: testdata/gen
        run: node gen-update-events.mjs
      - name: regenerate invalid UTF-8 fixtures
        working-directory: testdata/gen
        run: node gen-invalid-utf8.mjs
      - name: regenerate Any value fixtures
        working-directory: testdata/gen
        run: node gen-any-values.mjs
      - name: regenerate JSON text fixtures
        working-directory: testdata/gen
        run: node gen-json-text.mjs
      - name: regenerate key order fixtures
        working-directory: testdata/gen
        run: node gen-key-order.mjs
      - name: regenerate undo over the wire fixtures
        working-directory: testdata/gen
        run: node gen-undo-wire.mjs
      - name: regenerate pending state fixtures
        working-directory: testdata/gen
        run: node gen-pending-state.mjs
      - name: regenerate pending merge fixtures
        working-directory: testdata/gen
        run: node gen-pending-merge.mjs
      - name: regenerate format undefined fixtures
        working-directory: testdata/gen
        run: node gen-format-undefined.mjs
      - name: regenerate dense V2 fixtures
        working-directory: testdata/gen
        run: node gen-v2-dense.mjs
      - name: regenerate event delta fixtures
        working-directory: testdata/gen
        run: node gen-event-delta.mjs
      - name: regenerate merge and diff fixtures
        working-directory: testdata/gen
        run: node gen-merge-updates.mjs
      - name: regenerate update utility fixtures (after the merge fixtures)
        working-directory: testdata/gen
        run: node gen-update-utilities.mjs
      - name: regenerate V8 sort fixtures
        working-directory: testdata/gen
        run: node gen-v8-sort.mjs
      - name: regenerate search marker fixtures
        working-directory: testdata/gen
        run: node gen-search-markers.mjs
      - name: regenerate differential fuzzer corpus fixtures
        working-directory: testdata/gen
        run: node gen-difffuzz.mjs
      - name: regenerate reverse (Go encodes → JS decodes) fixtures
        run: go run ./cmd/gen-go-fixtures
      - name: verify no diff
        run: git diff --exit-code testdata/
      - name: the README's fixture counts must match the fixtures
        # The counts are the project's headline claim, and they are exactly the
        # kind of number that rots: adding a scenario is routine, updating the
        # four sentences about it is not. Both had drifted before this guard.
        working-directory: testdata/gen
        run: node check-fixture-counts.mjs
      - name: run go tests against fixtures
        run: |
          go test ./internal/lib0/... -run TestFixtures
          go test ./internal/encoding/... -run TestFixtures
          go test ./internal/awareness/... -run TestFixtures
          go test ./internal/sync/... -run TestFixtures
          go test ./internal/types/... -run TestFixtures_DecodeApplyJSXmlUpdates
          go test ./internal/undo/... -run TestUndoFixtures
          go test ./internal/encoding/... -run TestSnapshotFixtures
          go test . -run TestSubdoc_CrossLanguage
          go test . -run TestWireEdge_CrossLanguage
          go test . -run TestRichText_Fixtures
          go test . -run TestObservers_Fixtures
          go test . -run TestUpdateEvents_Fixtures
          go test . -run TestInvalidUTF8_Fixtures
          go test . -run 'TestAnyValues_'
      - name: validate reverse fixtures (JS applies Go-encoded bytes)
        working-directory: testdata/gen
        run: node validate-go-fixtures.mjs
      - name: differential fuzzer against yjs (300 seeds)
        # Seeded scenarios replayed in ygo and in yjs (internal/difffuzz,
        # testdata/gen/difffuzz-oracle.mjs), compared step by step. REQUIRE
        # makes a missing node or oracle a failure here, not a skip; the
        # other steps filter tests by name and would not reach this one.
        env:
          YGO_DIFFFUZZ_REQUIRE: "1"
          YGO_DIFFFUZZ_SEEDS: "300"
          YGO_DIFFFUZZ_OUT: ${{ runner.temp }}/difffuzz
        run: go test -count=1 -run '^TestDifferential_(Seeds|Corpus)$' .
      - name: upload diverging scenarios
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: difffuzz-scenarios
          path: ${{ runner.temp }}/difffuzz/**
          if-no-files-found: ignore
